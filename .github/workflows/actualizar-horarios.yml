name: Actualizar horarios oficiales

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar y comprobar el GTFS oficial de Euskotren
        run: node scripts/actualizar-horarios.mjs
        env:
          NAP_API_KEY: ${{ secrets.NAP_API_KEY }}
      - name: Guardar los horarios en la web
        run: |
          git config user.name "topo-donostia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/horarios.json
          git diff --cached --quiet || git commit -m "Horarios oficiales actualizados $(date -u +%F)"
          git push
